<!doctype html><html lang="en"><head><title>Slider · glass-controls</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../dist/glass-controls.css">
<link rel="stylesheet" href="demo.css">
<script type="importmap">{ "imports": { "liquid-glass-js": "../node_modules/liquid-glass-js/dist/liquid-glass.esm.js" } }</script>
<script type="module">
  import { init } from '../dist/glass-controls.js'
  // Demo knobs: ?chroma=0.25 splits colour at live rims; ?refraction=0 turns the live rim off.
  const q = new URLSearchParams(location.search), root = document.documentElement.style
  if (q.has('chroma')) root.setProperty('--gc-chroma', q.get('chroma'))
  if (q.has('refraction')) root.setProperty('--gc-refraction', q.get('refraction'))
  window.glass = init()
</script>
</head><body>
<main class="scene" data-glass-scene><img class="bg" src="photos/monstera.jpg" alt="">
<div class="stage">
  <div data-glass="surface" class="pane" id="pane">
    <label for="bright">Brightness</label>
    <div data-glass="slider" id="sl"><input id="bright" type="range" min="0" max="100" step="1" value="35"></div>
  </div>
</div>
<p class="credit">Photo: <a href="https://unsplash.com/photos/WyXMm6s9LYg">Maria Lupan</a> on Unsplash</p><a class="back" href="./">All examples</a></main></body></html>
