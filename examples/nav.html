<!doctype html><html lang="en"><head><title>Nav capsule · glass-controls</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../dist/glass-controls.css">
<link rel="stylesheet" href="demo.css">
<script type="module">
  import { init } from '../dist/glass-controls.js'
  window.glass = init()
</script>
</head><body>
<main class="scene"><img class="bg" src="photos/neon-street.jpg" alt="">
<style>
  .nav-wrap { position: absolute; z-index: 1; top: 20px; left: 50%; translate: -50%; width: max-content; max-width: calc(100vw - 24px); }
  .bar { display: flex; align-items: center; padding: 4px; }
  .bar .more { min-height: 36px; padding: 0 16px; border: 0; border-radius: 999px; background: none; font: 500 15px/20px system-ui; color: inherit; cursor: pointer; }
  .bar .more:focus-visible { outline: none; box-shadow: var(--gc-focus-in); }
  @media (hover: hover) { .bar .more:hover { background: color-mix(in srgb, currentColor 12%, transparent); } }
  .bar .more:active { background: color-mix(in srgb, currentColor 20%, transparent); }
  .sheet { --gc-radius: 24px; position: absolute; top: calc(100% + 8px); right: 0; width: 200px; padding: 6px; transform-origin: 100% 0; transition: opacity 160ms, scale 240ms cubic-bezier(.32,.72,0,1); }
  .sheet[hidden] { display: block; opacity: 0; scale: .9; pointer-events: none; visibility: hidden; }
</style>
<div class="nav-wrap">
<nav data-glass="surface" class="bar" aria-label="Main" id="bar">
  <ul data-glass="segmented">
    <li><a href="#home" aria-current="page">Home</a></li><li><a href="#work">Work</a></li><li><a href="#about">About</a></li>
  </ul>
  <button class="more" aria-expanded="false" aria-controls="sheet" id="more">More</button>
</nav>
<div data-glass="surface" data-glass-menu class="sheet" id="sheet" hidden>
  <ul data-glass="segmented" aria-orientation="vertical">
    <li><a href="#journal">Journal</a></li><li><a href="#talks">Talks</a></li><li><a href="#contact">Contact</a></li>
  </ul>
</div>
</div>
<script>
  // Demo page code: the links mark aria-current; the More button opens the sheet.
  for (const a of document.querySelectorAll("nav a, .sheet a")) a.addEventListener("click", (e) => {
    e.preventDefault()
    const list = a.closest("ul")
    for (const b of list.querySelectorAll("a")) b.toggleAttribute("aria-current", b === a)
    if (a.hasAttribute("aria-current")) a.setAttribute("aria-current", "page")
  })
  more.addEventListener("click", () => { const open = sheet.hidden; sheet.hidden = !open; more.setAttribute("aria-expanded", open) })
  addEventListener("keydown", (e) => { if (e.key === "Escape" && !sheet.hidden) { sheet.hidden = true; more.setAttribute("aria-expanded", "false"); more.focus() } })
</script>
<p class="credit">Photo: <a href="https://unsplash.com/photos/2uuaV_fI4LU">Jezael Melgoza</a> on Unsplash</p><a class="back" href="./">All examples</a></main></body></html>
