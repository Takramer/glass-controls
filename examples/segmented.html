<!doctype html><html lang="en"><head><title>Segmented control · glass-controls</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../dist/glass-controls.css">
<link rel="stylesheet" href="demo.css">
<script type="module">
  import { init } from '../dist/glass-controls.js'
  window.glass = init()
</script>
</head><body>
<main class="scene"><img class="bg" src="photos/facade-berlin.jpg" alt="">
<div class="stage">
  <div data-glass="surface" class="capsule" id="seg">
    <div data-glass="segmented" role="group" aria-label="Range">
      <button aria-pressed="true">Day</button><button aria-pressed="false">Week</button><button aria-pressed="false">Month</button><button aria-pressed="false">Year</button>
    </div>
  </div>
</div>
<p class="credit">Photo: <a href="https://unsplash.com/photos/A1Y1KRh9qoU">Cheng Lin</a> on Unsplash</p><a class="back" href="./">All examples</a></main></body></html>
