<!doctype html><html lang="en"><head><title>Button · glass-controls</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../dist/glass-controls.css">
<link rel="stylesheet" href="demo.css">
<script type="module">
  import { init } from '../dist/glass-controls.js'
  window.glass = init()
</script>
</head><body>
<main class="scene"><img class="bg" src="photos/neon-signs.jpg" alt="">
<div class="stage">
  <button data-glass="button" id="play">Play</button>
  <button data-glass="button" id="follow" aria-pressed="false">Follow</button>
  <button data-glass="button" id="share" aria-label="Share"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3v12M7 8l5-5 5 5M5 14v5h14v-5"/></svg></button>
</div>
<script>follow.addEventListener("click", () => follow.setAttribute("aria-pressed", follow.getAttribute("aria-pressed") !== "true"))</script>
<p class="credit">Photo: <a href="https://unsplash.com/photos/SfnOJ6c3ySw">mos design</a> on Unsplash</p><a class="back" href="./">All examples</a></main></body></html>
